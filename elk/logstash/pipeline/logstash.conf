input {
    file {
        path => "/app/logs/shop.log"
        start_position => "beginning"
        sincedb_path => "/dev/null"
    }
}

filter {
    grok {
        match => {
            "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:level}\s+%{NUMBER:pid}\s+---\s+\[%{DATA:service}\]\s+\[%{DATA:thread}\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:log_message}"
        }
    }

    date {
        match => ["log_timestamp", "ISO8601"]
        target => "@timestamp"
    }

    mutate {
        rename => {
            "log_message" => "message"
        }

        remove_field => [
            "log_timestamp"
        ]
    }
}

output {
    stdout {
        codec => rubydebug
    }

    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "shop-logs-%{+YYYY.MM.dd}"
    }
}