
services:
  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: shop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: shopdb
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Spring Boot Backend with New Relic and Splunk
  backend:
    build: ./backend
    container_name: shop-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/shopdb
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: ecommerce-mini
    ports:
      - "8081:8080"
      - "8082:8080"
    volumes:
      - shop-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: splunk
      options:
        splunk-token: "${SPLUNK_HEC_TOKEN}"
        splunk-url: "${SPLUNK_HEC_URL}"
        splunk-sourcetype: "docker:container"
        splunk-insecureskipverify: "true"
        tag: "{{.Name}}"
    restart: unless-stopped

  # Frontend
  frontend:
    build: ./frontend
    container_name: shop-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: shop-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: shop-kibana
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "shop-elk-encryption-key-2026-learning-project-12345"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: shop-logstash
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - shop-logs:/app/logs:ro
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: shop-prometheus
    ports:
      - "9090:9090"
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:11.4.0
    container_name: shop-grafana
    ports:
      - "3001:3000"
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

# Persistent volumes
volumes:
  mysql-data:
  shop-logs:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
